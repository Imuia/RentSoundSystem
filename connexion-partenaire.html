<body class="bg-background text-on-background font-body min-h-screen">
<div class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_30%_20%,rgba(252,3,109,.20),transparent_35%),linear-gradient(180deg,#131313,#0e0e0e)]"></div>
  <div class="relative z-10 w-full max-w-[520px] glass-panel rounded-2xl p-8 md:p-10">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 border border-primary/30 text-primary mb-5">
        <span class="material-symbols-outlined text-3xl">lock</span>
      </div>
      <h1 class="font-headline text-3xl md:text-4xl font-bold text-white">Connexion partenaire</h1>
      <p class="text-on-surface-variant mt-3">Connectez-vous pour accéder à votre espace partenaire RentSoundSystem.</p>
    </div>
    <form id="rss-login-form" class="space-y-5">
      <div>
        <label class="text-sm text-on-surface-variant mb-2 block">Email professionnel</label>
        <input id="login-email" type="email" required class="w-full bg-surface-container-highest border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="vous@societe.com">
      </div>
      <div>
        <label class="text-sm text-on-surface-variant mb-2 block">Mot de passe</label>
        <input id="login-password" type="password" required class="w-full bg-surface-container-highest border border-white/10 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-primary" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-primary text-on-primary py-4 rounded-lg uppercase tracking-widest font-bold hover:bg-primary-container transition">
        Se connecter
      </button>
      <div id="rss-login-message" class="text-sm text-on-surface-variant text-center"></div>
    </form>
    <div class="text-center mt-6 text-sm text-on-surface-variant">
      Pas encore partenaire ?
      <a href="/inscription-partenaire.html" class="text-primary hover:underline">Créer un compte</a>
    </div>
  </div>
</div>
