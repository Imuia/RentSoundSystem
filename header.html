<!-- TopNavBar -->
<style id="rss-header-self-contained-style">
/* Header RentSoundSystem autonome : même rendu sur toutes les pages */
:root{
  --rss-pink:#fc036d;
  --rss-bg:#131313;
  --rss-bg-soft:rgba(19,19,19,.84);
  --rss-text:#e2e2e2;
  --rss-muted:#e6bcc2;
  --rss-border:rgba(255,255,255,.10);
}
.rss-site-header{
  position:fixed!important;top:0!important;left:0!important;right:0!important;width:100%!important;z-index:9999!important;
  background:var(--rss-bg-soft)!important;backdrop-filter:blur(14px)!important;-webkit-backdrop-filter:blur(14px)!important;
  border-bottom:1px solid var(--rss-border)!important;box-sizing:border-box!important;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
}
.rss-site-header *{box-sizing:border-box!important}
.rss-header-inner{
  max-width:1280px!important;margin:0 auto!important;padding:16px 40px!important;min-height:72px!important;
  display:flex!important;align-items:center!important;justify-content:space-between!important;gap:24px!important;
}
.rss-header-left,.rss-header-actions{display:flex!important;align-items:center!important;gap:14px!important}
.rss-header-left{gap:24px!important}
.rss-header-logo{
  color:var(--rss-pink)!important;font-family:Manrope,Inter,sans-serif!important;font-size:15px!important;line-height:1!important;
  font-weight:900!important;letter-spacing:-.02em!important;text-decoration:none!important;white-space:nowrap!important;
}
.rss-desktop-nav{display:flex!important;align-items:center!important;gap:30px!important}
.rss-desktop-nav a,.rss-mobile-nav a{
  color:var(--rss-muted)!important;text-decoration:none!important;font-size:14px!important;line-height:20px!important;font-weight:700!important;
  transition:color .2s ease,border-color .2s ease,background .2s ease,transform .2s ease!important;
}
.rss-desktop-nav a:hover,.rss-mobile-nav a:hover{color:var(--rss-pink)!important}
.rss-header-icon{
  display:flex!important;align-items:center!important;justify-content:center!important;width:36px!important;height:36px!important;
  color:var(--rss-text)!important;border-radius:8px!important;text-decoration:none!important;
}
.rss-header-icon:hover{color:var(--rss-pink)!important;background:rgba(252,3,109,.08)!important}
.rss-auth-button{
  min-height:34px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;
  padding:8px 14px!important;border-radius:4px!important;border:1px solid rgba(252,3,109,.70)!important;color:var(--rss-text)!important;
  background:transparent!important;text-decoration:none!important;font-size:13px!important;line-height:16px!important;font-weight:800!important;white-space:nowrap!important;
}
.rss-auth-button:hover{color:#fff!important;border-color:var(--rss-pink)!important;background:rgba(252,3,109,.10)!important;box-shadow:0 0 18px rgba(252,3,109,.18)!important}
.rss-auth-button.bg-\[\#fc036d\]{background:var(--rss-pink)!important;color:#fff!important;box-shadow:0 0 18px rgba(252,3,109,.35)!important}
.rss-auth-button .material-symbols-outlined{font-size:18px!important}
.rss-mobile-trigger{
  display:none!important;align-items:center!important;justify-content:center!important;width:40px!important;height:40px!important;
  border:1px solid var(--rss-border)!important;border-radius:8px!important;color:var(--rss-text)!important;cursor:pointer!important;
}
.rss-mobile-trigger:hover{color:var(--rss-pink)!important;border-color:rgba(252,3,109,.5)!important}
.rss-mobile-nav{display:none!important;border-top:1px solid var(--rss-border)!important;background:rgba(19,19,19,.97)!important;backdrop-filter:blur(12px)!important}
.rss-mobile-nav-inner{max-width:1280px!important;margin:0 auto!important;padding:16px!important;display:flex!important;flex-direction:column!important;gap:12px!important}
.rss-mobile-nav a{padding:8px 0!important}
.rss-mobile-actions{display:grid!important;grid-template-columns:1fr 1fr!important;gap:12px!important;padding-top:12px!important;border-top:1px solid var(--rss-border)!important}
.rss-catalog-button{
  display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;min-height:42px!important;border-radius:4px!important;
  background:var(--rss-pink)!important;color:#fff!important;font-size:13px!important;font-weight:800!important;text-decoration:none!important;
}
#rss-mobile-menu-toggle:checked ~ .rss-mobile-nav{display:block!important}
@media(max-width:900px){
  .rss-header-inner{padding:14px 16px!important;min-height:68px!important}
  .rss-desktop-nav{display:none!important}
  .rss-header-icon{display:none!important}
  .rss-auth-button[data-rss-auth-link="desktop"]{display:none!important}
  .rss-mobile-trigger{display:flex!important}
}
@media(max-width:480px){
  .rss-header-logo{font-size:14px!important}
  .rss-mobile-actions{grid-template-columns:1fr!important}
}
</style>
