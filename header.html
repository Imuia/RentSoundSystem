<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://crxofkxinsspfgdsxpiy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_oRZBgjE_IWkCWn6glpie2A_ymVzz1Uj';
  const ACCOUNT_URL = '/espace-client.html';
  const LOGIN_URL = '/connexion-inscription.html';

  function setAuthButton(isConnected, user){
    const label = isConnected ? 'Mon compte' : "S'inscrire / Connexion";
    const icon = isConnected ? 'account_circle' : 'login';
    const href = isConnected ? ACCOUNT_URL : LOGIN_URL;

    ['','-mobile'].forEach(function(suffix){
      const link = document.getElementById('rss-auth-link' + suffix);
      const text = document.getElementById('rss-auth-label' + suffix);
      const ic = document.getElementById('rss-auth-icon' + suffix);
      if(link){
        link.href = href;
        link.setAttribute('aria-label', label);
        link.title = isConnected && user?.email ? user.email : label;
        link.classList.toggle('bg-[#fc036d]', isConnected);
        link.classList.toggle('text-white', isConnected);
        link.classList.toggle('shadow-[0_0_18px_rgba(252,3,109,0.35)]', isConnected);
      }
      if(text) text.textContent = label;
      if(ic) ic.textContent = icon;
    });
  }

  function loadSupabaseSdk(){
    return new Promise(function(resolve){
      if(window.supabase) return resolve(true);
      const existing = document.querySelector('script[data-rss-supabase-sdk]');
      if(existing){ existing.addEventListener('load', function(){ resolve(!!window.supabase); }); return; }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.async = true;
      s.dataset.rssSupabaseSdk = 'true';
      s.onload = function(){ resolve(!!window.supabase); };
      s.onerror = function(){ resolve(false); };
      document.head.appendChild(s);
    });
  }

  async function updateHeaderAuth(){
    try{
      const ok = await loadSupabaseSdk();
      if(!ok || !window.supabase){ setAuthButton(false); return; }
      if(!window.__rssHeaderSupabase){
        window.__rssHeaderSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      const client = window.__rssHeaderSupabase;
      const { data } = await client.auth.getSession();
      setAuthButton(!!data?.session, data?.session?.user || null);
      if(!window.__rssHeaderAuthListener){
        window.__rssHeaderAuthListener = true;
        client.auth.onAuthStateChange(function(_event, session){
          setAuthButton(!!session, session?.user || null);
        });
      }
    }catch(e){
      setAuthButton(false);
    }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', updateHeaderAuth);
  else updateHeaderAuth();
  window.rssUpdateHeaderAuth = updateHeaderAuth;
})();
</script>
