</head><body class="min-h-screen flex flex-col bg-background text-on-background"><div id="header-container"></div><main class="flex-grow pt-28 pb-20 px-6 md:px-10">
<section class="max-w-4xl mx-auto text-center mb-10"><span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-primary/10 border border-primary/30 text-primary text-xs uppercase tracking-[.18em] font-bold"><span class="material-symbols-outlined text-lg">verified_user</span> Accès partenaire</span><h1 class="font-headline text-4xl md:text-6xl font-extrabold mt-6 mb-4">Connexion partenaire</h1><p class="text-on-surface-variant text-lg">Entrez l’email utilisé lors de votre inscription partenaire pour accéder à votre statut et à votre tableau de bord.</p></section>

<script>
(function(){const SUPABASE_URL='https://crxofkxinsspfgdsxpiy.supabase.co';const SUPABASE_KEY='sb_publishable_oRZBgjE_IWkCWn6glpie2A_ymVzz1Uj';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const form=document.getElementById('partner-login-form');const msg=document.getElementById('partner-login-message');function show(type,html){msg.className='mt-6 rounded-xl p-5 border '+(type==='ok'?'border-primary/40 bg-primary/10':'border-yellow-500/30 bg-yellow-500/10');msg.innerHTML=html;msg.classList.remove('hidden')}form.addEventListener('submit',async(e)=>{e.preventDefault();const email=document.getElementById('partner-email').value.trim().toLowerCase();localStorage.setItem('rssPartnerEmail',email);show('wait','Vérification du statut partenaire...');const {data,error}=await client.from('partner_requests').select('*').ilike('email',email).order('created_at',{ascending:false}).limit(1);if(error){show('warn','Impossible de vérifier votre compte pour le moment. Réessayez plus tard.');return}const request=data&&data[0];if(!request){show('warn','Aucune demande partenaire trouvée avec cet email. <a class="text-primary underline" href="/devenir-partenaire.html">Créer une demande partenaire</a>.');return}localStorage.setItem('rssPartnerRequestId',request.id);localStorage.setItem('rssPartnerStatus',request.status||'pending');if(request.status==='approved'){window.location.href='/tableau-de-bord-partenaire.html';return}if(request.status==='rejected'){show('warn','Votre demande n’a pas été validée. Contactez l’équipe RentSoundSystem pour plus d’informations.');return}show('ok','Votre demande est bien enregistrée et en cours de validation. Vous pourrez accéder au tableau de bord après approbation.');});})();
