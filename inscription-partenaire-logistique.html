<style>
body{background:#131313;color:#e2e2e2;font-family:Inter,sans-serif}.font-headline{font-family:Manrope,sans-serif}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
#header-container{min-height:73px}#footer-container{min-height:320px}#header-container header,#footer-container footer{display:block}
.glass{background:linear-gradient(145deg,rgba(31,31,31,.92),rgba(14,14,14,.9));border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px)}
.input{background:#fff!important;color:#111!important;border:1px solid rgba(255,255,255,.14)!important;border-radius:10px!important;padding:12px 14px!important;width:100%}
.input::placeholder{color:#6b7280!important}.select{background:#fff!important;color:#111!important;border-radius:10px!important;padding:12px 14px!important;width:100%}
.label{display:block;color:#e6bcc2;font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:8px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#FC036D;color:white;padding:14px 22px;border-radius:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#2a2a2a;color:#e2e2e2;padding:14px 22px;border-radius:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px;border:1px solid rgba(255,255,255,.12)}
.step-active{border-color:rgba(252,3,109,.65)!important;box-shadow:0 0 28px rgba(252,3,109,.18)}
.card{background:#1f1f1f;border:1px solid rgba(255,255,255,.08);border-radius:16px}

@media(max-width:768px){.hero-title{font-size:38px!important;line-height:44px!important}.grid-steps{grid-template-columns:1fr!important}}
</style>
<title>Logistique partenaire | RentSoundSystem</title></head><body class="min-h-screen bg-background text-on-background"><div id="header-container"></div><main>
<section class="pt-28 pb-20 px-6 md:px-10 max-w-6xl mx-auto">

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10 grid-steps">
  <div class="card p-4 "><div class="text-primary text-xs font-bold uppercase tracking-widest">Étape 1</div><div class="font-headline font-bold mt-1">Inscription</div></div><div class="card p-4 "><div class="text-primary text-xs font-bold uppercase tracking-widest">Étape 2</div><div class="font-headline font-bold mt-1">Matériel</div></div><div class="card p-4 step-active"><div class="text-primary text-xs font-bold uppercase tracking-widest">Étape 3</div><div class="font-headline font-bold mt-1">Logistique</div></div><div class="card p-4 "><div class="text-primary text-xs font-bold uppercase tracking-widest">Étape 4</div><div class="font-headline font-bold mt-1">KYC</div></div>
</div>
<div class="glass rounded-2xl p-8">
<h1 class="font-headline text-4xl font-extrabold mb-3">Logistique et couverture</h1>
<form id="form-step3" class="grid md:grid-cols-2 gap-5 mt-8">
  <div><label class="label">Zone couverte</label><input id="coverage_area" class="input" placeholder="Ville, région, pays"></div>
  <div><label class="label">Rayon de livraison</label><input id="delivery_radius" class="input" placeholder="Ex : 50 km"></div>
  <div><label class="label">Mode de remise</label><select id="handover_mode" class="select"><option>Retrait chez le partenaire</option><option>Livraison possible</option><option>Retrait + livraison</option></select></div>
  <div><label class="label">Technicien disponible</label><select id="technician_available" class="select"><option>Oui</option><option>Non</option><option>Selon disponibilité</option></select></div>
  <div><label class="label">Caution souhaitée</label><input id="deposit_policy" class="input" placeholder="Ex : Stripe caution 800 €"></div>
  <div><label class="label">Assurance</label><select id="insurance_status" class="select"><option>Assurance professionnelle</option><option>Assurance à compléter</option><option>À discuter</option></select></div>
  <div class="md:col-span-2"><label class="label">Notes logistiques</label><textarea id="logistics_notes" class="input" rows="5" placeholder="Horaires, conditions de remise, contraintes..."></textarea></div>
  <div class="md:col-span-2 flex flex-col sm:flex-row justify-between gap-3"><a class="btn-secondary" href="/inscription-partenaire-materiel.html">Retour</a><button class="btn-primary" type="submit">Continuer</button></div>
</form>
</div>
</section></main><div id="footer-container"></div>
<script src="/components.js"></script>
<script>
const RSS_SUPABASE_URL="https://crxofkxinsspfgdsxpiy.supabase.co";
const RSS_SUPABASE_KEY="sb_publishable_oRZBgjE_IWkCWn6glpie2A_ymVzz1Uj";
const rssSupabase = window.supabase ? window.supabase.createClient(RSS_SUPABASE_URL, RSS_SUPABASE_KEY) : null;

function getDraft(){try{return JSON.parse(localStorage.getItem("rss_partner_draft")||"{}")}catch(e){return {}}}
function setDraft(data){localStorage.setItem("rss_partner_draft", JSON.stringify(Object.assign(getDraft(), data||{})))}
function setPartnerSession(email){if(email)localStorage.setItem("rss_partner_email", String(email).toLowerCase().trim())}
function getPartnerEmail(){return (localStorage.getItem("rss_partner_email")||getDraft().email||"").toLowerCase().trim()}
function val(id){const el=document.getElementById(id);return el?el.value.trim():""}
function checkedValues(name){return Array.from(document.querySelectorAll('input[name="'+name+'"]:checked')).map(e=>e.value)}
function fillFromDraft(){const d=getDraft();Object.keys(d).forEach(k=>{const el=document.getElementById(k);if(el && typeof d[k]==="string") el.value=d[k]})}
function showMsg(id,type,msg){const el=document.getElementById(id); if(!el)return; el.className= type==="ok" ? "alert border-green-500/30 bg-green-500/10" : "alert"; el.innerHTML=msg; el.classList.remove("hidden")}
async function fetchPartnerByEmail(email){
  if(!rssSupabase || !email) return null;
  const {data,error}=await rssSupabase.from("partner_requests").select("*").eq("email",email).order("created_at",{ascending:false}).limit(1).maybeSingle();
  if(error){console.warn("partner fetch",error);return null}
  return data;
}
function statusLabel(status){return status==="approved"?"Validé":status==="rejected"?"Refusé":"En validation"}
</script>

<script>
document.addEventListener("DOMContentLoaded", fillFromDraft);
document.getElementById("form-step3").addEventListener("submit",function(e){
 e.preventDefault();
 setDraft({coverage_area:val("coverage_area"),delivery_radius:val("delivery_radius"),handover_mode:val("handover_mode"),technician_available:val("technician_available"),deposit_policy:val("deposit_policy"),insurance_status:val("insurance_status"),logistics_notes:val("logistics_notes")});
 location.href="/inscription-partenaire-kyc.html";
});
</script></body></html>
