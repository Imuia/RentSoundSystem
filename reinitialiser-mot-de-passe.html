<script id="rss-reset-password-script">
(function () {
  const SUPABASE_URL = 'https://crxofkxinsspfgdsxpiy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_oRZBgjE_IWkCWn6glpie2A_ymVzz1Uj';

  function ready(fn){ document.readyState !== 'loading' ? fn() : document.addEventListener('DOMContentLoaded', fn); }

  function showMessage(text, type) {
    const el = document.getElementById('reset-message');
    if (!el) return;
    el.textContent = text;
    el.className = 'text-sm text-center mt-4 ' + (type === 'success' ? 'text-green-400' : type === 'error' ? 'text-red-400' : 'text-on-surface-variant');
  }

  function setCriterion(id, ok) {
    const el = document.getElementById(id);
    if (!el) return;
    const icon = el.querySelector('.material-symbols-outlined');
    el.style.color = ok ? '#FC036D' : '';
    if (icon) {
      icon.style.color = ok ? '#FC036D' : '';
      icon.classList.toggle('opacity-50', !ok);
    }
  }

  function validatePassword(password) {
    const lengthOk = password.length >= 12;
    const caseOk = /[a-z]/.test(password) && /[A-Z]/.test(password);
    const specialOk = /\d/.test(password) && /[^A-Za-z0-9]/.test(password);
    setCriterion('criteria-length', lengthOk);
    setCriterion('criteria-case', caseOk);
    setCriterion('criteria-special', specialOk);
    return lengthOk && caseOk && specialOk;
  }

  function setupToggle(buttonId, inputId) {
    const btn = document.getElementById(buttonId);
    const input = document.getElementById(inputId);
    if (!btn || !input) return;
    btn.addEventListener('click', function () {
      const icon = btn.querySelector('.material-symbols-outlined');
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      if (icon) icon.textContent = visible ? 'visibility_off' : 'visibility';
    });
  }

  ready(function () {
    const form = document.getElementById('reset-password-form');
    const password = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');
    const submitBtn = document.getElementById('reset-submit-btn');

    setupToggle('toggle-new-password', 'new_password');
    setupToggle('toggle-confirm-password', 'confirm_password');

    password?.addEventListener('input', function(){ validatePassword(password.value); });

    form?.addEventListener('submit', async function (event) {
      event.preventDefault();

      const newPassword = password.value.trim();
      const confirmation = confirmPassword.value.trim();

      if (!validatePassword(newPassword)) {
        showMessage('Le mot de passe ne respecte pas encore tous les critères.', 'error');
        return;
      }

      if (newPassword !== confirmation) {
        showMessage('Les deux mots de passe ne sont pas identiques.', 'error');
        return;
      }

      if (!window.supabase) {
        showMessage('Supabase n’est pas chargé.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-60', 'cursor-not-allowed');
      showMessage('Mise à jour en cours...', 'info');

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { error } = await client.auth.updateUser({ password: newPassword });

      if (error) {
        showMessage('Lien expiré ou invalide. Redemandez un email de réinitialisation.', 'error');
      } else {
        showMessage('Mot de passe mis à jour. Redirection vers la connexion...', 'success');
        setTimeout(function(){ window.location.href = '/mot-de-passe-reinitialise.html'; }, 1600);
      }

      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
    });
  });
})();
</script>
