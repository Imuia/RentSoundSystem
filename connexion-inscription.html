</span>

</div>
</div>
<div>

                En vous connectant, vous acceptez nos <a class="underline hover:text-primary transition-colors" href="/conditions-utilisation.html">Conditions de Service</a> et notre <a class="underline hover:text-primary transition-colors" href="/politique-confidentialite.html">Politique de Confidentialité</a>.

<script>
document.addEventListener('DOMContentLoaded', function () {
  const loginTab = document.getElementById('login-tab');
  const registerTab = document.getElementById('register-tab');
  const nameField = document.getElementById('name-field');
  const companyField = document.getElementById('company-field');
  const confirmField = document.getElementById('confirm-password-field');
  const loginOptions = document.getElementById('login-options');
  const submitBtn = document.getElementById('auth-submit');
  const title = document.querySelector('main h1');
  const subtitle = document.querySelector('main h1 + p');
  const form = document.getElementById('auth-form');
  const password = document.getElementById('password');
  const togglePassword = document.getElementById('toggle-password');
  let mode = 'login';

  function activateTab(nextMode) {
    mode = nextMode;
    const isRegister = mode === 'register';
    loginTab.className = isRegister
      ? 'flex-1 py-2 text-sm font-semibold rounded-md text-on-surface-variant hover:text-on-surface transition-all'
      : 'flex-1 py-2 text-sm font-semibold rounded-md bg-surface-container-high text-on-surface shadow-sm border border-outline-variant/20 transition-all';
    registerTab.className = isRegister
      ? 'flex-1 py-2 text-sm font-semibold rounded-md bg-surface-container-high text-on-surface shadow-sm border border-outline-variant/20 transition-all'
      : 'flex-1 py-2 text-sm font-semibold rounded-md text-on-surface-variant hover:text-on-surface transition-all';

    nameField.classList.toggle('hidden', !isRegister);
    companyField.classList.toggle('hidden', !isRegister);
    confirmField.classList.toggle('hidden', !isRegister);
    loginOptions.classList.toggle('hidden', isRegister);
    submitBtn.textContent = isRegister ? 'Créer mon compte' : 'Se connecter';
    if (title) title.textContent = isRegister ? 'Créer un compte' : 'Bienvenue';
    if (subtitle) subtitle.textContent = isRegister
      ? 'Créez votre espace pour louer ou proposer du matériel.'
      : "Accédez à l'inventaire de production technique.";
  }

  loginTab.addEventListener('click', () => activateTab('login'));
  registerTab.addEventListener('click', () => activateTab('register'));

  togglePassword.addEventListener('click', function () {
    password.type = password.type === 'password' ? 'text' : 'password';
    togglePassword.querySelector('span').textContent = password.type === 'password' ? 'visibility' : 'visibility_off';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (mode === 'register') {
      const confirm = document.getElementById('confirm-password').value;
      if (password.value !== confirm) {
        alert('Les mots de passe ne correspondent pas.');
        return;
      }
      alert('Compte prêt à être créé avec Supabase.');
    } else {
      alert('Connexion prête à être reliée à Supabase.');
    }
  });
  // Boutons “Ou continuer avec”
  const googleBtn = document.getElementById('oauth-google');
  const partnerBtn = document.getElementById('oauth-partner');
  const proBtn = document.getElementById('oauth-pro');

  if (googleBtn) {
    googleBtn.addEventListener('click', function () {
      alert('Connexion Google prête à être reliée à Supabase OAuth.');
      // Quand Supabase OAuth sera configuré, remplacer l’alerte par :
      // supabase.auth.signInWithOAuth({ provider: 'google' });
    });
  }

  if (partnerBtn) {
    partnerBtn.addEventListener('click', function () {
      activateTab('register');
      const companyInput = document.getElementById('company-name');
      if (companyInput) companyInput.focus();
    });
  }

  if (proBtn) {
    proBtn.addEventListener('click', function () {
      window.location.href = '/devenir-partenaire.html';
    });
  }

});
</script>
