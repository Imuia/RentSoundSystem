</head><body class="min-h-screen bg-background text-on-background"><div id="header-container"></div><main>
<section class="pt-28 pb-20 px-6 md:px-10 max-w-6xl mx-auto">

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10 grid-steps">
  <div class="card p-4 "><div class="text-primary text-xs font-bold uppercase tracking-widest">Étape 1</div><div class="font-headline font-bold mt-1">Inscription</div></div><div class="card p-4 step-active"><div class="text-primary text-xs font-bold uppercase tracking-widest">Étape 2</div><div class="font-headline font-bold mt-1">Matériel</div></div><div class="card p-4 "><div class="text-primary text-xs font-bold uppercase tracking-widest">Étape 3</div><div class="font-headline font-bold mt-1">Logistique</div></div><div class="card p-4 "><div class="text-primary text-xs font-bold uppercase tracking-widest">Étape 4</div><div class="font-headline font-bold mt-1">KYC</div></div>

<form id="form-step2" class="space-y-6">
  <div class="grid md:grid-cols-3 gap-4">
    <label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Deejay" class="mr-2 text-primary"> Deejay</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Event & production" class="mr-2 text-primary"> Event & production</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Furniture" class="mr-2 text-primary"> Furniture</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Headphone" class="mr-2 text-primary"> Headphone</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Keyboards" class="mr-2 text-primary"> Keyboards</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Multimedia" class="mr-2 text-primary"> Multimedia</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Sound & lighting" class="mr-2 text-primary"> Sound & lighting</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="String instruments" class="mr-2 text-primary"> String instruments</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Studio" class="mr-2 text-primary"> Studio</label><label class="card p-4 cursor-pointer"><input type="checkbox" name="categories" value="Wind instruments" class="mr-2 text-primary"> Wind instruments</label>

  </div>

  <div class="flex flex-col sm:flex-row justify-between gap-3"><a class="btn-secondary" href="/inscription-partenaire.html">Retour</a><button class="btn-primary" type="submit">Continuer</button></div>
</form>

<script>
const RSS_SUPABASE_URL="https://crxofkxinsspfgdsxpiy.supabase.co";
const RSS_SUPABASE_KEY="sb_publishable_oRZBgjE_IWkCWn6glpie2A_ymVzz1Uj";
const rssSupabase = window.supabase ? window.supabase.createClient(RSS_SUPABASE_URL, RSS_SUPABASE_KEY) : null;

function getDraft(){try{return JSON.parse(localStorage.getItem("rss_partner_draft")||"{}")}catch(e){return {}}}
function setDraft(data){localStorage.setItem("rss_partner_draft", JSON.stringify(Object.assign(getDraft(), data||{})))}
function setPartnerSession(email){if(email)localStorage.setItem("rss_partner_email", String(email).toLowerCase().trim())}
function getPartnerEmail(){return (localStorage.getItem("rss_partner_email")||getDraft().email||"").toLowerCase().trim()}
function val(id){const el=document.getElementById(id);return el?el.value.trim():""}
function checkedValues(name){return Array.from(document.querySelectorAll('input[name="'+name+'"]:checked')).map(e=>e.value)}
function fillFromDraft(){const d=getDraft();Object.keys(d).forEach(k=>{const el=document.getElementById(k);if(el && typeof d[k]==="string") el.value=d[k]})}
function showMsg(id,type,msg){const el=document.getElementById(id); if(!el)return; el.className= type==="ok" ? "alert border-green-500/30 bg-green-500/10" : "alert"; el.innerHTML=msg; el.classList.remove("hidden")}
async function fetchPartnerByEmail(email){
  if(!rssSupabase || !email) return null;
  const {data,error}=await rssSupabase.from("partner_requests").select("*").eq("email",email).order("created_at",{ascending:false}).limit(1).maybeSingle();
  if(error){console.warn("partner fetch",error);return null}
  return data;
}
function statusLabel(status){return status==="approved"?"Validé":status==="rejected"?"Refusé":"En validation"}
</script>

<script>
document.addEventListener("DOMContentLoaded", fillFromDraft);
document.getElementById("form-step2").addEventListener("submit",function(e){
 e.preventDefault();
 setDraft({categories:checkedValues("categories"),equipment_count:val("equipment_count"),fleet_value:val("fleet_value"),equipment_condition:val("equipment_condition"),equipment_description:val("equipment_description")});
 location.href="/inscription-partenaire-logistique.html";
});
</script><script>window.RSS_PARTNER_PAGE="inscription-partenaire-materiel.html";</script>
