<title>Ajouter annonce partenaire | RentSoundSystem</title></head><body class="min-h-screen bg-background text-on-background"><div id="header-container"></div><main>
<section class="pt-28 pb-20 px-6 md:px-10 max-w-5xl mx-auto">
 <div class="glass rounded-2xl p-8">
  <h1 class="font-headline text-4xl font-extrabold mb-3">Ajouter une annonce</h1>
  <p class="text-on-surface-variant mb-8">La publication directe est réservée aux partenaires validés.</p>
  <div id="ad-message" class="hidden mb-6"></div>
  <form id="ad-form" class="grid md:grid-cols-2 gap-5">
   <div><label class="label">Titre annonce</label><input id="ad_title" class="input" required placeholder="Ex : Pioneer CDJ-3000"></div>
   <div><label class="label">Catégorie</label><select id="ad_category" class="select"><option>Deejay</option><option>Event & production</option><option>Furniture</option><option>Headphone</option><option>Keyboards</option><option>Multimedia</option><option>Sound & lighting</option><option>String instruments</option><option>Studio</option><option>Wind instruments</option></select></div>
   <div><label class="label">Prix / jour</label><input id="ad_price" type="number" class="input" required placeholder="150"></div>
   <div><label class="label">Caution</label><input id="ad_deposit" type="number" class="input" placeholder="800"></div>
   <div><label class="label">Ville</label><input id="ad_city" class="input" required></div>
   <div><label class="label">Pays</label><input id="ad_country" class="input" required></div>
   <div class="md:col-span-2"><label class="label">URL image</label><input id="ad_image_url" class="input" placeholder="https://..."></div>
   <div class="md:col-span-2"><label class="label">Description</label><textarea id="ad_description" class="input" rows="6" required></textarea></div>
   <div class="md:col-span-2"><button class="btn-primary" type="submit">Enregistrer en attente</button></div>
  </form>
 </div>
</section></main><div id="footer-container"></div>
<script src="/components.js"></script>
<script>
const RSS_SUPABASE_URL="https://crxofkxinsspfgdsxpiy.supabase.co";
const RSS_SUPABASE_KEY="sb_publishable_oRZBgjE_IWkCWn6glpie2A_ymVzz1Uj";
const rssSupabase = window.supabase ? window.supabase.createClient(RSS_SUPABASE_URL, RSS_SUPABASE_KEY) : null;

function getDraft(){try{return JSON.parse(localStorage.getItem("rss_partner_draft")||"{}")}catch(e){return {}}}
function setDraft(data){localStorage.setItem("rss_partner_draft", JSON.stringify(Object.assign(getDraft(), data||{})))}
function setPartnerSession(email){if(email)localStorage.setItem("rss_partner_email", String(email).toLowerCase().trim())}
function getPartnerEmail(){return (localStorage.getItem("rss_partner_email")||getDraft().email||"").toLowerCase().trim()}
function val(id){const el=document.getElementById(id);return el?el.value.trim():""}
function checkedValues(name){return Array.from(document.querySelectorAll('input[name="'+name+'"]:checked')).map(e=>e.value)}
function fillFromDraft(){const d=getDraft();Object.keys(d).forEach(k=>{const el=document.getElementById(k);if(el && typeof d[k]==="string") el.value=d[k]})}
function showMsg(id,type,msg){const el=document.getElementById(id); if(!el)return; el.className= type==="ok" ? "alert border-green-500/30 bg-green-500/10" : "alert"; el.innerHTML=msg; el.classList.remove("hidden")}
async function fetchPartnerByEmail(email){
  if(!rssSupabase || !email) return null;
  const {data,error}=await rssSupabase.from("partner_requests").select("*").eq("email",email).order("created_at",{ascending:false}).limit(1).maybeSingle();
  if(error){console.warn("partner fetch",error);return null}
  return data;
}
function statusLabel(status){return status==="approved"?"Validé":status==="rejected"?"Refusé":"En validation"}
</script>

<script>
let currentPartner=null;
async function initAd(){
 const email=getPartnerEmail(); currentPartner=await fetchPartnerByEmail(email);
 if(!currentPartner || currentPartner.status!=="approved"){
   document.getElementById("ad-form").classList.add("hidden");
   showMsg("ad-message","err","Votre compte partenaire doit être validé avant de publier une annonce.");
   return;
 }
 document.getElementById("ad_city").value=currentPartner.city||"";
 document.getElementById("ad_country").value=currentPartner.country||"";
}
document.addEventListener("DOMContentLoaded",initAd);
document.getElementById("ad-form").addEventListener("submit",async function(e){
 e.preventDefault();
 if(!rssSupabase || !currentPartner)return;
 const payload={partner_request_id:currentPartner.id,title:val("ad_title"),category:val("ad_category"),price:Number(val("ad_price")||0),deposit:Number(val("ad_deposit")||0),city:val("ad_city"),country:val("ad_country"),image_url:val("ad_image_url"),description:val("ad_description"),status:"pending"};
 const {error}=await rssSupabase.from("partner_listings").insert(payload);
 if(error){showMsg("ad-message","err","Erreur : "+error.message);return}
 showMsg("ad-message","ok","Annonce enregistrée. Elle est maintenant en attente de validation.");
 this.reset();
});
</script></body></html>
