<style>
        body { background-color: #131313; color: #e5e2e1; }
        .glass-panel {
            background: linear-gradient(145deg, rgba(31,31,31,0.6) 0%, rgba(20,20,20,0.8) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-shadow { box-shadow: 0 0 30px rgba(252, 3, 109, 0.3); }
        .input-dark {
            background-color: #353534;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #e5e2e1;
        }
        .input-dark:focus {
            border-color: #FC036D;
            box-shadow: 0 0 10px rgba(252, 3, 109, 0.2);
            outline: none;
        }
        
        /* Tooltip */
        .tooltip-container { position: relative; display: inline-block; }
        .tooltip-text {
            visibility: hidden;
            width: 250px;
            background-color: #2a2a2a;
            color: #e5e2e1;
            text-align: left;
            border-radius: 0.25rem;
            padding: 12px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            left: 50%;
            margin-left: -125px;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid rgba(255,255,255,0.05);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #2a2a2a transparent transparent transparent;
        }
        .tooltip-container:hover .tooltip-text { visibility: visible; opacity: 1; }
    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body class="bg-background text-on-background font-body min-h-screen">
<div class="min-h-screen flex">
  <aside class="hidden lg:flex w-72 bg-surface-container-lowest border-r border-white/10 p-6 flex-col gap-6">
    <div class="font-headline text-2xl font-bold text-white">RentSoundSystem</div>
    <nav class="space-y-2 text-on-surface-variant">
      <a href="/tableau-de-bord-partenaire.html" class="block px-4 py-3 rounded-lg hover:bg-surface-container hover:text-primary">Tableau de bord</a>
      <a href="/ajouter-annonce.html" class="block px-4 py-3 rounded-lg bg-primary/10 text-primary border border-primary/30">Ajouter une annonce</a>
      <a href="/tableau-de-bord-partenaire.html" class="block px-4 py-3 rounded-lg hover:bg-surface-container hover:text-primary">Optimisation IA</a>
      <a href="/partenaire-paiement.html" class="block px-4 py-3 rounded-lg hover:bg-surface-container hover:text-primary">Paiements</a>
    </nav>
  </aside>
  <main class="flex-1 p-6 md:p-10">
    <div class="max-w-5xl mx-auto">
      <div class="mb-8">
        <p class="text-primary uppercase tracking-widest text-sm font-bold mb-2">Submit ad</p>
        <h1 class="font-headline text-4xl md:text-5xl font-bold text-white">Ajouter une annonce matériel</h1>
        <p class="text-on-surface-variant mt-3">Publiez votre matériel après validation partenaire. Les annonces restent en attente si votre compte n’est pas approuvé.</p>
      </div>
      <form id="rss-listing-form" class="glass-panel rounded-2xl p-6 md:p-8 grid md:grid-cols-2 gap-6">
        <div class="md:col-span-2">
          <label class="block text-sm text-on-surface-variant mb-2">Titre de l’annonce</label>
          <input id="listing-title" required class="input-dark w-full rounded-lg px-4 py-3" placeholder="Ex : Pioneer CDJ-3000, L-Acoustics K2...">
        </div>
        <div>
          <label class="block text-sm text-on-surface-variant mb-2">Catégorie officielle</label>
          <select id="listing-category" required class="input-dark w-full rounded-lg px-4 py-3">
            <option value="">Choisir</option>
            <option>Deejay</option><option>Event & production</option><option>Furniture</option><option>Headphone</option><option>Keyboards</option><option>Multimedia</option><option>Sound & lighting</option><option>String instruments</option><option>Studio</option><option>Wind instruments</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-on-surface-variant mb-2">Marque / modèle</label>
          <input id="listing-brand" class="input-dark w-full rounded-lg px-4 py-3" placeholder="Marque, modèle">
        </div>
        <div>
          <label class="block text-sm text-on-surface-variant mb-2">Prix/jour</label>
          <input id="listing-price" type="number" min="0" class="input-dark w-full rounded-lg px-4 py-3" placeholder="0">
        </div>
        <div>
          <label class="block text-sm text-on-surface-variant mb-2">Ville</label>
          <input id="listing-city" required class="input-dark w-full rounded-lg px-4 py-3" placeholder="Ville">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm text-on-surface-variant mb-2">Description</label>
          <textarea id="listing-description" rows="5" class="input-dark w-full rounded-lg px-4 py-3" placeholder="État, accessoires, conditions de location, caution..."></textarea>
        </div>
        <div class="md:col-span-2 flex flex-col sm:flex-row gap-4 justify-end">
          <a href="/tableau-de-bord-partenaire.html" class="px-6 py-3 rounded-lg border border-white/10 text-on-surface text-center">Annuler</a>
          <button type="submit" class="px-8 py-3 rounded-lg bg-primary text-on-primary uppercase tracking-widest font-bold">Enregistrer l’annonce</button>
        </div>
        <div id="rss-listing-message" class="md:col-span-2 text-sm text-on-surface-variant"></div>
      </form>
    </div>
  </main>
</div>
<script>window.RSS_PARTNER_PAGE="ajouter-annonce.html";</script>
