<script id="rss-contact-functional">
document.addEventListener('DOMContentLoaded', () => {

  const form = document.getElementById('rss-contact-form');
  const status = document.getElementById('rss-form-status');

  function showStatus(message, type){
    if(!status) return;
    status.textContent = message;
    status.className = 'rss-form-status show ' + (type || '');
  }

  if(new URLSearchParams(window.location.search).get('sent') === '1'){
    showStatus('Votre message a bien été envoyé à contact@rentsoundsystem.com', 'success');
  }

  if(form){
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const button = form.querySelector('button[type="submit"]');
      const original = button.innerHTML;

      button.innerHTML = 'ENVOI EN COURS...';
      button.disabled = true;

      try{
        const response = await fetch(form.action, {
          method:'POST',
          body:new FormData(form),
          headers:{'Accept':'application/json'}
        });

        if(response.ok){
          showStatus('Message envoyé avec succès.', 'success');
          form.reset();
        }else{
          showStatus('Erreur lors de l’envoi.', 'error');
        }
      }catch(err){
        showStatus('Erreur réseau.', 'error');
      }

      setTimeout(() => {
        button.innerHTML = original;
        button.disabled = false;
      }, 1500);
    });
  }

  document.querySelectorAll('a').forEach(link => {
    const txt = (link.textContent || '').toLowerCase();

    if(txt.includes('linkedin')){
      link.href = 'https://linkedin.com';
      link.target = '_blank';
    }

    if(txt.includes('instagram')){
      link.href = 'https://instagram.com';
      link.target = '_blank';
    }

    if(txt.includes('youtube')){
      link.href = 'https://youtube.com';
      link.target = '_blank';
    }
  });
});
</script>

<script id="rss-contact-prefill-from-faq">
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const question = params.get('question') || params.get('message') || '';
  const subject = params.get('subject') || '';

  const messageField = document.getElementById('message');
  const subjectField = document.getElementById('subject');

  if(subjectField && subject){
    subjectField.value = subject;
  }

  if(messageField && question){
    messageField.value = question;
    setTimeout(() => {
      messageField.focus();
      messageField.scrollIntoView({behavior:'smooth', block:'center'});
    }, 400);
  }
});
</script>
