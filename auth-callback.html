<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion sécurisée – RentSoundSystem</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--pink:#fc036d;--bg:#111;--text:#f5f5f5;--muted:#d8bdc7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 0%,rgba(252,3,109,.22),transparent 32%),#111;color:var(--text);font-family:Inter,Arial,sans-serif}
    .card{width:min(520px,92vw);background:#1b1b1e;border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:34px 28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .brand{color:var(--pink);font-weight:900;font-size:22px;letter-spacing:-.02em;margin-bottom:18px}
    h1{font-size:24px;margin:0 0 10px}
    p{color:var(--muted);line-height:1.55;margin:0 0 16px}
    .loader{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.16);border-top-color:var(--pink);animation:spin 1s linear infinite;margin:22px auto 0}
    a{color:#fff}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
<script type="module" src="/speed-insights.js"></script>
</head>
<body>
  <main class="card">
    <div class="brand">RENTSOUNDSYSTEM</div>
    <h1>Connexion à votre espace client</h1>
    <p id="status">Nous vérifions votre lien sécurisé et ouvrons vos réservations.</p>
    <div class="loader" aria-hidden="true"></div>
  </main>

  <script>
    (async function(){
      const SUPABASE_URL = "https://crxofkxinsspfgdsxpiy.supabase.co";
      const SUPABASE_KEY = "sb_publishable_oRZBgjE_IWkCWn6glpie2A_ymVzz1Uj";
      const DEFAULT_NEXT = "/espace-client-reservations.html";
      const status = document.getElementById("status");

      function safeNext(value){
        try{
          const raw = String(value || DEFAULT_NEXT).trim();
          if (!raw || !raw.startsWith("/") || raw.startsWith("//")) return DEFAULT_NEXT;
          return raw;
        } catch (_) { return DEFAULT_NEXT; }
      }

      const url = new URL(window.location.href);
      const next = safeNext(url.searchParams.get("next"));
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce"
        }
      });

      async function waitForSession(maxMs){
        const started = Date.now();
        while (Date.now() - started < maxMs) {
          const { data } = await client.auth.getSession();
          if (data && data.session && data.session.user) return data.session;
          await new Promise(resolve => setTimeout(resolve, 180));
        }
        const { data } = await client.auth.getSession();
        return data && data.session ? data.session : null;
      }

      try {
        if (url.searchParams.get("error") || hash.get("error")) {
          throw new Error(url.searchParams.get("error_description") || hash.get("error_description") || "Lien de connexion invalide ou expiré.");
        }

        const code = url.searchParams.get("code");
        if (code) {
          status.textContent = "Connexion sécurisée en cours…";
          const { error } = await client.auth.exchangeCodeForSession(code);
          if (error) throw error;
        } else if (hash.get("access_token") && hash.get("refresh_token")) {
          status.textContent = "Connexion sécurisée en cours…";
          const { error } = await client.auth.setSession({
            access_token: hash.get("access_token"),
            refresh_token: hash.get("refresh_token")
          });
          if (error) throw error;
        }

        const session = await waitForSession(4500);
        if (!session) throw new Error("Session non créée après validation du lien.");

        window.history.replaceState({}, document.title, "/auth-callback.html");
        window.location.replace(next);
      } catch (error) {
        console.error("auth-callback", error);
        status.innerHTML = "Le lien n’a pas pu ouvrir automatiquement votre session. Redirection vers la page de connexion…";
        setTimeout(function(){
          window.location.replace("/connexion-inscription.html?redirect=" + encodeURIComponent(next));
        }, 1500);
      }
    })();
  </script>
</body>
</html>
